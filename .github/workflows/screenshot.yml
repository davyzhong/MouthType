name: 📸 README Screenshots

# 自动截图 + 自动 commit，确保 README 永远反映最新界面
#
# GUI 桌面应用 v3 兜底：截 GitHub README 渲染快照。
# v3.1 升级计划：macOS runner + launchPersistentContext + nativeScreenshot。
#
# 触发：
#   1. 手动触发（workflow_dispatch）
#   2. 每天 UTC 凌晨自动跑（schedule）
#   3. README / scripts / workflow 变化时自动跑（push paths）

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    paths:
      - 'README.md'
      - 'scripts/screenshot.js'
      - '.github/workflows/screenshot.yml'

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: ⏬ 检出代码
        uses: actions/checkout@v4

      - name: 🔧 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 安装依赖
        run: npm ci

      - name: 🎭 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 📸 跑截图脚本
        run: node scripts/screenshot.js

      - name: 🔍 检测变化
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain assets/screenshots/*.png 2>/dev/null)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ 检测到截图变化，将自动 commit"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ 截图无变化（README 与代码同步）"
          fi

      - name: 💾 自动 commit 截图
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/*.png
          git commit -m "📸 auto: 自动更新 README 渲染截图（GitHub Action）

          触发：\${{ github.workflow }} (\${{ github.event_name }})
          commit: \${{ github.sha }}

          CI 自动化截图脚本：scripts/screenshot.js" || true
          git push origin HEAD:"${{ github.ref_name }}"